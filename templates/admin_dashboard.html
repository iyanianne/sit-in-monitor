<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie-edge">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="icon" type="image/x-icon" href="../static/favicon/ccslogo.png">
  <title>SIT IN MONITORING</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <style>
    body {
      margin: 0;
      font-family: 'Inter';
    }
    
    .topnav {
      overflow: hidden;
      background-color: #3f3636;
      padding: 5px 0;
    }
    
    .topnav a {
      float: right;
      transition: 0.3s;
      color: #f2f2f2;
      text-align: center;
      padding: 6px 10px;
      text-decoration: none;
      font-size: 15px;
    }
    
    .topnav a:hover {
      background-color: #ccc;
      border-radius: 4px;
      color:rgb(75, 72, 71);
    }
    
    .topnav a.active {
      background-color:rgb(33, 92, 114);
      color: white;
    }

    .head {
      float: left;
      color: #f2f2f2;
      text-align: center;
      padding: 6px 10px;
      text-decoration: none;
      font-size: 20px;
    }

    .row {
      display: flex;
    }

    .column {
      float: left;
      margin-top: 5px;
      border: 1px solid #ccc;
      margin-left: 10px;
      border-radius: 7px;
      height: 550px;
    }

    .container::after, .row::after {
      content: "";
      clear: both;
      padding: 8px;
      display: table;
    }

    .col-head {
      height: 40px;
      border-radius: 4px;
      font-size: 15px;
      padding-left: 4px;
      display: flex;
      align-items: center;
      color: white;
      background-color: #3f3636;
    }
    
    .col-head i {
      margin-right: 8px; 
    }

    input[type=text], select, input[type=number] {
      padding: 8px;
      margin: 8px;
      background: transparent;
      outline: none;
      display: inline-block;
      border-radius: 4px;
      color: white;
    }

    .column p {
      padding-left: 5px;
      color: rgb(68, 65, 64);
    }
  </style>

<body>
    <div class="topnav">
      <div class="head"> 
        College of Computer Studies Admin 
      </div>
      <p><a href="/logout" class="w3-bar-item w3-button"> Logout</a></p>
      <a href="#ad_reserve">Reservation</a>
      <a href="#ad_feedback">Feedback Reports</a>
      <a href="#ad_reports">Sit-in Reports</a>
      <a href="#ad_records">Sit-in Records</a>
      <a href="#ad_students">Students</a>
      <a href="#ad_dashboard">Home</a>
    </div>
    
  <div>
    <input type="text" id="search" placeholder="Search Students">
    <div class="row">
      <div class="column" style="width: 45%;">
        <div class="col-head">
          <i class="fa fa-chart-bar"></i> Statistics
        </div>
        <div class="p">
          <p> <b>Students Registered:</b> </p>
          <p> <b>Currently Sit-in:</b> </p>
          <p> <b>Total Sit-in:</b> </p>
        </div>
        <!-- Chart container -->
        <canvas id="sitInChart" width="400" height="200"></canvas>
      </div>
    
      <!-- Announcement Container -->
      <div class="column" style="width: 45%">
        <div class="col-head">
          <i class="fa fa-bullhorn"></i> Announcements
        </div>
      </div>
    </div>
  </div>

  <script>
    // Chart data
    const data = {
      labels: ['Students Registered', 'Currently Sit-in', 'Total Sit-in'], 
      datasets: [{
        label: 'Sit-in Statistics',
        data: [100, 40, 60], 
        backgroundColor: [
          'rgba(150, 121, 105, 0.2)', 
          'rgba(110, 38, 14, 0.2)', 
          'rgba(139, 69, 19, 0.2)'  
        ],
        borderColor: [
          'rgba(150, 121, 105, 1)', 
          'rgba(110, 38, 14, 1)', 
          'rgba(139, 69, 19, 1)'  
        ],
        borderWidth: 1
      }]
    };

    // Chart configuration
    const config = {
      type: 'bar', 
      data: data,
      options: {
        scales: {
          y: {
            beginAtZero: true
          }
        }
      }
    };

    // Create the chart
    const sitInChart = new Chart(
      document.getElementById('sitInChart'),
      config
    );
  </script>
</body>
</html>
