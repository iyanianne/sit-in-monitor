<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="icon" type="image/x-icon" href="../static/favicon/ccslogo.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            width: 100%;
            position: relative;
            background-color: #f5f5f5;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            height: 100%;
            width: 100%;
            background-image: url('../static/images/bg-image.jpg');
            background-position: center;
            background-size: cover;
            filter: brightness(0.7);
            z-index: -1;
        }

        .login-wrapper {
            width: 400px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 16px;
            text-align: center;
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        .login-wrapper img {
            width: 100px;
            height: 100px;
            margin-bottom: 15px;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.2));
        }
        
        .login-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .login-form h2 {
            font-size: 28px;
            color: #fff;
            margin-bottom: 15px;
            font-weight: 600;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.3);
        }

        .input-group {
            position: relative;
            margin-bottom: 15px;
        }

        .input-group i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.8);
            font-size: 18px;
        }

        input[type="text"],
        input[type="password"],
        input[type="number"],
        input[type="email"],
        select {
            width: 100%;
            padding: 12px 20px 12px 45px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            color: white;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        input:focus {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.4);
            outline: none;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
        }

        ::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        button[type="submit"] {
            width: 100%;
            background-color: #1e7898;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            transition: all 0.3s ease;
            margin-top: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        button[type="submit"]:hover {
            background-color: #1a6883;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background-color: #fff;
            margin: 2% auto;
            padding: 30px;
            width: 90%;
            max-width: 600px;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-content h3 {
            color: #333;
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            text-align: center;
        }

        .close {
            position: absolute;
            right: 20px;
            top: 20px;
            color: #666;
            font-size: 28px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .close:hover {
            color: #333;
            transform: rotate(90deg);
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 500;
            font-size: 14px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            color: #333;
            background: #fff;
            font-size: 14px;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #1e7898;
            box-shadow: 0 0 0 2px rgba(30, 120, 152, 0.1);
        }

        .name-fields {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
        }

        .flash {
            padding: 12px 15px;
            margin: 0 auto 20px;
            border-radius: 8px;
            font-weight: 500;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 1;
            transition: opacity 0.5s ease;
            font-size: 14px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .flash.success {
            background-color: rgba(40, 167, 69, 0.9);
            color: white;
            border: 1px solid rgba(40, 167, 69, 0.2);
        }

        .flash.danger {
            background-color: rgba(220, 53, 69, 0.9);
            color: white;
            border: 1px solid rgba(220, 53, 69, 0.2);
        }

        .flash.info {
            background-color: rgba(23, 162, 184, 0.9);
            color: white;
            border: 1px solid rgba(23, 162, 184, 0.2);
        }

        .flash::before {
            font-family: "Font Awesome 6 Free";
            font-weight: 900;
            margin-right: 10px;
        }

        .flash.success::before {
            content: "\f00c";
        }

        .flash.danger::before {
            content: "\f071";
        }

        .flash.info::before {
            content: "\f05a";
        }

        .register-link {
            margin-top: 20px;
            color: white;
            font-size: 15px;
        }

        .register-link a {
            color: #1e7898;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .register-link a:hover {
            color: #1a6883;
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .login-wrapper {
                width: 90%;
                padding: 30px 20px;
            }

            .modal-content {
                width: 95%;
                margin: 10% auto;
                padding: 20px;
            }

            .name-fields {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <img src="{{ url_for('static', filename='images/ccslogo.png') }}" alt="logo">
        <h2 style="font-family: 'Inter', sans-serif; font-weight: 600; color: white;">CCS Sit-In Monitor</h2>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash {{ category }}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        
        <form action="{{ url_for('login') }}" method="POST" class="login-form">
            <div class="input-group">
                <i class="fas fa-user"></i>
                <input type="text" name="username" id="username" placeholder="ID Number or Username" required>
            </div>
            
            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" name="password" id="password" placeholder="Password" required>
            </div>

            <button type="submit">Login</button>
        </form>
        
        <div class="register-link">
            Don't have an account? <a href="#" id="openModal">Register here</a>
        </div>
    </div>

    <!-- Register Modal -->
    <div id="registerModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h3>Register for Sit-in Monitoring</h3>
            <form action="{{ url_for('register') }}" method="POST">
                <div class="form-group">
                    <label for="reg_idno">ID Number</label>
                    <input type="text" id="reg_idno" name="idno" required oninput="updateUsername()">
                </div>

                <div class="name-fields">
                    <div class="form-group">
                        <label for="lastname">Last Name</label>
                        <input type="text" id="lastname" name="lastname" required>
                    </div>
                    <div class="form-group">
                        <label for="fname">First Name</label>
                        <input type="text" id="fname" name="fname" required>
                    </div>
                    <div class="form-group">
                        <label for="mname">Middle Name</label>
                        <input type="text" id="mname" name="mname">
                    </div>
                </div>

                <div class="name-fields">
                    <div class="form-group">
                        <label for="course">Course</label>
                        <select id="course" name="course" required>
                            <option value="">Select Course</option>
                            <option value="BSIT">BSIT</option>
                            <option value="BSCS">BSCS</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="yrlvl">Year Level</label>
                        <select id="yrlvl" name="yrlvl" required>
                            <option value="">Select Year Level</option>
                            <option value="1st Year">1st Year</option>
                            <option value="2nd Year">2nd Year</option>
                            <option value="3rd Year">3rd Year</option>
                            <option value="4th Year">4th Year</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="reg_username">Username</label>
                    <input type="text" id="reg_username" name="username" placeholder="Leave blank to use ID number">
                </div>

                <div class="form-group">
                    <label for="reg_password">Password</label>
                    <input type="password" id="reg_password" name="password" required>
                </div>

                <button type="submit" style="margin-top: 10px;">Register</button>
            </form>
        </div>
    </div>

    <script>
        // Get the modal
        var modal = document.getElementById("registerModal");

        // Get the button that opens the modal
        var btn = document.getElementById("openModal");

        // Get the <span> element that closes the modal
        var span = document.getElementsByClassName("close")[0];

        // When the user clicks the button, open the modal 
        btn.onclick = function() {
            modal.style.display = "block";
        }

        // When the user clicks on <span> (x), close the modal
        span.onclick = function() {
            modal.style.display = "none";
        }

        // When the user clicks anywhere outside of the modal, close it
        window.onclick = function(event) {
            if (event.target == modal) {
                modal.style.display = "none";
            }
        }

        // Function to update username field with ID number
        function updateUsername() {
            var idno = document.getElementById("reg_idno").value;
            var username = document.getElementById("reg_username");
            username.placeholder = idno;
        }

        // Auto-hide flash messages after 5 seconds
        setTimeout(function() {
            var flashMessages = document.getElementsByClassName('flash');
            for(var i = 0; i < flashMessages.length; i++) {
                (function(index) {
                    setTimeout(function() {
                        if (flashMessages[index]) {
                            flashMessages[index].style.opacity = '0';
                            setTimeout(function() {
                                if (flashMessages[index]) {
                                    flashMessages[index].style.display = 'none';
                                }
                            }, 500);
                        }
                    }, 5000);
                })(i);
            }
        }, 0);
    </script>
</body>
</html>
